<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Arch (network test)</title>
<link rel="stylesheet" href="./vendor/xterm.css">
<style>html,body{margin:0;background:#000}</style>
</head>
<body>
<div id="terminal"></div>
<script src="./load.js"></script>
<script src="./vendor/xterm.js"></script>
<script src="./vendor/xterm-pty.js"></script>
<script src="./dist/stack.js"></script>
<script src="./module-net.js"></script>
<script type="module">
  import initEmscriptenModule from './out.js';
  // ?net=browser                      -> network stack runs inside this page (HTTP/HTTPS to CORS-enabled sites only)
  // ?net=delegate=ws://host:9999      -> frames go to a c2w-net relay (full internet)
  const term = new Terminal({ cols: 100, rows: 30, scrollback: 5000 });
  window.term = term;
  term.open(document.getElementById('terminal'));
  const { master, slave } = openpty();
  term.loadAddon(master);
  Module.pty = slave;
  Module['mainScriptUrlOrBlob'] = location.origin + '/out.js';

  function getNetParam() {
    for (const v of location.search.substring(1).split('&')) {
      const kv = v.split('=');
      if (decodeURIComponent(kv[0]) === 'net') return { mode: kv[1], param: kv.slice(2).join('=') };
    }
    return null;
  }
  function start() {
    (async () => {
      await initEmscriptenModule(Module);
      const oldPoll = Module['TTY'].stream_ops.poll, pty = Module['pty'];
      Module['TTY'].stream_ops.poll = function (stream, timeout) {
        if (!pty.readable) return (pty.readable ? 1 : 0) | (pty.writable ? 4 : 0);
        return oldPoll.call(stream, timeout);
      };
    })();
  }
  const net = getNetParam();
  if (net && net.mode === 'delegate') {
    Module['websocket'] = { url: net.param };
    Module['preRun'].push((mod) => { mod.FS.mkdir('/.wasmenv'); });
    start();
  } else if (net && net.mode === 'browser') {
    const stackAddress = 'http://localhost:9999/';   // served by a mock server inside this page
    Module['websocket'] = { url: stackAddress };
    Stack.Start(stackAddress, location.origin + '/dist/stack-worker.js', location.origin + '/c2w-net-proxy.wasm.gzip', (cert) => {
      Module['preRun'].push((mod) => { mod.FS.mkdir('/.wasmenv'); mod.FS.writeFile('/.wasmenv/proxy.crt', cert); });
      start();
    });
  } else {
    Module['preRun'].push((mod) => { mod.FS.mkdir('/.wasmenv'); });
    start();
  }
</script>
</body>
</html>
